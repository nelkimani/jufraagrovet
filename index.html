<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14532D">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Jufra Agrovets — Owner</title>
<style>
:root{--green:#166534;--dark:#14532D;--amber:#F59E0B;--bg:#F8FAFC;--ink:#172033;--gray:#64748B;--border:#E2E8F0;--red:#DC2626;--warn:#B45309}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
.hidden{display:none!important}
header{background:var(--dark);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:17px}
header .sub{font-size:11px;opacity:.8;margin-top:2px;display:flex;justify-content:space-between;gap:8px}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
nav{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:var(--hh,64px);z-index:4}
nav button{flex:1;white-space:nowrap;padding:11px 14px;border:0;background:none;font-size:13px;color:var(--gray);border-bottom:3px solid transparent;cursor:pointer}
nav button.sel{color:var(--green);border-bottom-color:var(--amber);font-weight:600}
main{padding:14px;max-width:900px;margin:0 auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px}
.card .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--gray)}
.card .v{font-size:20px;font-weight:700;margin-top:3px}
.card.warn .v{color:var(--warn)}
.card.bad .v{color:var(--red)}
.panel{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:14px}
h2{font-size:14px;margin:0 0 10px}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.row:last-child{border-bottom:0}
.row .m{color:var(--gray);font-size:11.5px;margin-top:2px}
.row b{white-space:nowrap}
.tag{display:inline-block;padding:1px 7px;border-radius:20px;font-size:10.5px;font-weight:600;background:#FEF3C7;color:#92400E;margin-left:4px}
.tag.bad{background:#FEE2E2;color:#991B1B}.tag.ok{background:#DCFCE7;color:#166534}
.bars{display:flex;align-items:flex-end;gap:4px;height:110px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:9px;color:var(--gray);height:100%}
.bar i{display:block;width:100%;background:var(--green);border-radius:3px 3px 0 0;min-height:2px}
.bar.today i{background:var(--amber)}
input{width:100%;padding:11px;border:1px solid var(--border);border-radius:6px;font-size:15px;margin-bottom:10px}
.btn{background:var(--green);color:#fff;border:0;padding:12px 16px;border-radius:6px;font-size:15px;font-weight:600;width:100%;cursor:pointer}
#login{max-width:340px;margin:12vh auto;padding:0 16px}
#login h1{color:var(--dark);font-size:20px;margin:0 0 4px}
.err{color:var(--red);font-size:13px;margin-top:8px}
.empty{color:var(--gray);font-size:13px;padding:6px 0}
</style>
</head>
<body>
<div id="login" class="hidden">
  <h1>Jufra Agrovets</h1>
  <p style="color:var(--gray);font-size:13px;margin:0 0 18px">Owner view — sign in</p>
  <input id="em" type="email" placeholder="Email" autocomplete="username">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button class="btn" onclick="doLogin()">Sign in</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="app" class="hidden">
  <header id="hd">
    <h1>Jufra Agrovets</h1>
    <div class="sub"><span id="stamp">Loading…</span><span><button onclick="load()">Refresh</button> <button onclick="logout()">Sign out</button></span></div>
  </header>
  <nav id="tabs">
    <button data-t="today" class="sel">Today</button>
    <button data-t="sales">Sales</button>
    <button data-t="returns">Returns</button>
    <button data-t="shifts">Shifts</button>
    <button data-t="debts">Debts &amp; Stock</button>
  </nav>
  <main id="view"></main>
</div>

<script>
const FB = {apiKey:'AIzaSyCoz77CSrNjwmoOTDbN1m78s8yRE42kMK4', projectId:'jufra-37ce6', shop:'jufra'};
const LARGE_CASH_REFUND = 5000;     // returns refunded in cash at or above this are flagged
const BASE = 'https://firestore.googleapis.com/v1/projects/'+FB.projectId+'/databases/(default)/documents';
const SHOP = BASE+'/shops/'+FB.shop;
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => 'KES '+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0});
const pad = n => String(n).padStart(2,'0');
const dayKey = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const LS = {get:k=>{try{return JSON.parse(localStorage.getItem('jufra_owner_'+k));}catch(e){return null;}}, set:(k,v)=>{try{localStorage.setItem('jufra_owner_'+k,JSON.stringify(v));}catch(e){}}, del:k=>{try{localStorage.removeItem('jufra_owner_'+k);}catch(e){}}};
let auth = LS.get('auth'), tab = 'today', data = {}, timer = null;

/* ---- Firestore value decoding ---- */
function fromFV(v){
  if('stringValue' in v) return v.stringValue;
  if('integerValue' in v) return Number(v.integerValue);
  if('doubleValue' in v) return v.doubleValue;
  if('booleanValue' in v) return v.booleanValue;
  if('nullValue' in v) return null;
  if('arrayValue' in v) return (v.arrayValue.values||[]).map(fromFV);
  if('mapValue' in v) return fromFields(v.mapValue.fields||{});
  if('timestampValue' in v) return v.timestampValue;
  return null;
}
function fromFields(f){ const o={}; Object.keys(f||{}).forEach(k=>{ o[k]=fromFV(f[k]); }); return o; }
const decodeDoc = d => { const o=fromFields(d.fields); o._id=d.name.split('/').pop(); return o; };

/* ---- auth ---- */
async function doLogin(){
  const email=$('em').value.trim(), pass=$('pw').value; $('loginErr').textContent='';
  if(!email||!pass){ $('loginErr').textContent='Enter email and password'; return; }
  try{
    const r = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+FB.apiKey,
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass,returnSecureToken:true})});
    const j = await r.json();
    if(!r.ok) throw new Error(/INVALID|NOT_FOUND/.test((j.error||{}).message||'') ? 'Wrong email or password' : 'Sign-in failed');
    auth = {email:j.email, refreshToken:j.refreshToken, idToken:j.idToken, exp:Date.now()+(parseInt(j.expiresIn,10)-60)*1000};
    LS.set('auth', auth); start();
  }catch(e){ $('loginErr').textContent = e.message==='Failed to fetch' ? 'No internet connection' : e.message; }
}
function logout(){ auth=null; LS.del('auth'); clearInterval(timer); $('app').classList.add('hidden'); $('login').classList.remove('hidden'); }
async function token(){
  if(auth.idToken && Date.now()<auth.exp) return auth.idToken;
  const r = await fetch('https://securetoken.googleapis.com/v1/token?key='+FB.apiKey,
    {method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(auth.refreshToken)});
  const j = await r.json();
  if(!r.ok){ logout(); throw new Error('Session expired'); }
  auth.idToken=j.id_token; auth.refreshToken=j.refresh_token; auth.exp=Date.now()+(parseInt(j.expires_in,10)-60)*1000; LS.set('auth',auth);
  return auth.idToken;
}
async function api(url, body){
  const tok = await token();
  const r = await fetch(url, {method: body?'POST':'GET', headers:Object.assign({'Authorization':'Bearer '+tok}, body?{'Content-Type':'application/json'}:{}), body: body?JSON.stringify(body):undefined});
  if(r.status===404) return null;
  const j = await r.json();
  if(!r.ok) throw new Error(r.status===403 ? 'No permission — this account is not set as the owner in the Firestore rules' : ((j.error||{}).message||'Error '+r.status));
  return j;
}
async function query(collection, opts){
  const sq = {from:[{collectionId:collection}]};
  if(opts.order) sq.orderBy=[{field:{fieldPath:opts.order},direction:'DESCENDING'}];
  if(opts.gt) sq.where={fieldFilter:{field:{fieldPath:opts.gt},op:'GREATER_THAN',value:{integerValue:'0'}}};
  if(opts.limit) sq.limit=opts.limit;
  const res = await api(SHOP+':runQuery', {structuredQuery:sq});
  return (res||[]).filter(x=>x.document).map(x=>decodeDoc(x.document));
}

/* ---- loading ---- */
async function load(){
  $('stamp').textContent = 'Updating…';
  try{
    const [daily, sales, returns, shifts, invoices, customers, products, active] = await Promise.all([
      query('daily',{order:'date',limit:14}), query('sales',{order:'date',limit:80}), query('returns',{order:'date',limit:60}),
      query('shifts',{order:'start',limit:20}), query('invoices',{gt:'balance',limit:200}), query('customers',{gt:'balance',limit:200}),
      query('products',{limit:1000}), api(SHOP+'/state/activeShift')]);
    data = {daily, sales, returns, shifts, invoices, customers, products, active: active ? decodeDoc(active) : null};
    $('stamp').textContent = 'Updated '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    draw();
  }catch(e){ $('stamp').textContent = e.message; }
}

/* ---- views ---- */
const payLabel = s => { const p=(s.payments||[]); if(p.length===1) return {cash:'Cash',mpesa:'M-Pesa',credit:'On account'}[p[0].method]; return 'Split: '+p.map(x=>({cash:'Cash',mpesa:'M-Pesa',credit:'Credit'}[x.method])+' '+fmt(x.amount)).join(' + '); };
const codes = s => (s.payments||[]).filter(p=>p.method==='mpesa'&&p.ref).map(p=>p.ref).join(', ');
const settled = r => [r.refund.credit>0&&'Debt cleared '+fmt(r.refund.credit), r.refund.mpesa>0&&'M-Pesa '+fmt(r.refund.mpesa), r.refund.cash>0&&'Cash '+fmt(r.refund.cash)].filter(Boolean).join(' · ')||'-';
function draw(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('sel', b.dataset.t===tab));
  const v = $('view');
  if(tab==='today') v.innerHTML = viewToday();
  else if(tab==='sales') { v.innerHTML = viewSales(); }
  else if(tab==='returns') v.innerHTML = viewReturns();
  else if(tab==='shifts') v.innerHTML = viewShifts();
  else v.innerHTML = viewDebts();
}
function viewToday(){
  const today = dayKey(new Date()), t = data.daily.find(d=>d.date===today) || {net:0,gross:0,returns:0,retCount:0,count:0,cash:0,mpesa:0,credit:0,colCash:0,colMpesa:0,profit:0};
  const sh = data.active;
  const shiftHtml = (sh && sh.active)
    ? `<div class="row"><div>${esc(sh.cashier)} is on shift<div class="m">since ${new Date(sh.start).toLocaleString()} · opened with ${fmt(sh.openingCash)}</div></div><b>${(sh.sales||[]).length} sales</b></div>`
    : `<div class="empty">No shift is open right now.</div>`;
  const days = data.daily.slice().reverse(), max = Math.max(1, ...days.map(d=>d.net));
  const bars = days.map(d=>`<div class="bar ${d.date===today?'today':''}"><i style="height:${Math.max(2,Math.round(Math.max(0,d.net)/max*80))}px"></i>${d.date.slice(8)}</div>`).join('');
  return `<div class="cards">
    <div class="card"><div class="l">Net sales today</div><div class="v">${fmt(t.net)}</div></div>
    <div class="card"><div class="l">Sales made</div><div class="v">${t.count}</div></div>
    <div class="card"><div class="l">Cash (net)</div><div class="v">${fmt(t.cash)}</div></div>
    <div class="card"><div class="l">M-Pesa (net)</div><div class="v">${fmt(t.mpesa)}</div></div>
    <div class="card"><div class="l">Credit (net)</div><div class="v">${fmt(t.credit)}</div></div>
    <div class="card ${t.retCount?'warn':''}"><div class="l">Returns (${t.retCount})</div><div class="v">${fmt(t.returns)}</div></div>
    <div class="card"><div class="l">Debts collected</div><div class="v">${fmt((t.colCash||0)+(t.colMpesa||0))}</div></div>
    <div class="card"><div class="l">Gross profit</div><div class="v">${fmt(t.profit)}</div></div>
  </div>
  <div class="panel"><h2>Shift</h2>${shiftHtml}</div>
  <div class="panel"><h2>Net sales, last ${days.length} days</h2>${days.length?`<div class="bars">${bars}</div>`:'<div class="empty">No data yet.</div>'}</div>`;
}
function viewSales(){
  const q = ($('q')&&$('q').value||'').toLowerCase();
  return `<input id="q" placeholder="Search receipt, customer or M-Pesa code" oninput="filterSales()" value="${esc(q)}"><div id="salesList">${salesList(q)}</div>`;
}
function salesList(q){
  const rows = data.sales.filter(s=>!q || s._id.toLowerCase().includes(q) || (s.customer||'').toLowerCase().includes(q) || codes(s).toLowerCase().includes(q));
  return `<div class="panel">${rows.map(s=>`<div class="row"><div>${esc(s._id)} · ${esc(s.customer)}<div class="m">${new Date(s.date).toLocaleString()} · ${esc(s.cashier)} · ${esc(payLabel(s))}${codes(s)?' · '+esc(codes(s)):''}</div></div><b>${fmt(s.total)}</b></div>`).join('')||'<div class="empty">No sales found.</div>'}</div>`;
}
function filterSales(){ $('salesList').innerHTML = salesList($('q').value.toLowerCase()); }
function viewReturns(){
  return `<div class="panel"><h2>Returns &amp; refunds</h2>${data.returns.map(r=>{
    const flag = (r.refund.cash>=LARGE_CASH_REFUND) ? '<span class="tag bad">Large cash refund</span>' : '';
    const not = r.items.some(i=>!i.restock) ? '<span class="tag">Written off</span>' : '';
    return `<div class="row"><div>${esc(r._id)} · receipt ${esc(r.saleId)} · ${esc(r.customer)} ${flag}${not}
      <div class="m">${new Date(r.date).toLocaleString()} · ${esc(r.cashier)} · ${esc(r.reason)}${r.notes?' — '+esc(r.notes):''}</div>
      <div class="m">${r.items.map(i=>esc(i.name)+' ×'+i.qty).join(', ')}</div>
      <div class="m">${esc(settled(r))}${r.mpesaRef?' · reversal '+esc(r.mpesaRef):''}</div></div><b>${fmt(r.refundTotal)}</b></div>`; }).join('')||'<div class="empty">No returns yet.</div>'}</div>`;
}
function viewShifts(){
  return `<div class="panel"><h2>Closed shifts</h2>${data.shifts.filter(s=>s.end).map(s=>{
    const v = s.variance||0, cls = v===0?'ok':'bad';
    return `<div class="row"><div>${esc(s.cashier)} <span class="tag ${cls}">${v===0?'Balanced':(v<0?'Short ':'Over ')+fmt(Math.abs(v))}</span>
      <div class="m">${new Date(s.start).toLocaleString()} → ${new Date(s.end).toLocaleTimeString()}</div>
      <div class="m">Opened ${fmt(s.openingCash)} · expected ${fmt(s.expected)} · counted ${fmt(s.actualCash)}${s.closeNotes?' · '+esc(s.closeNotes):''}</div></div><b>${(s.sales||[]).length} sales</b></div>`; }).join('')||'<div class="empty">No closed shifts yet.</div>'}</div>`;
}
function viewDebts(){
  const owed = data.customers.reduce((a,c)=>a+(c.balance||0),0), today = dayKey(new Date());
  const low = data.products.filter(p=>p.active!==false && p.stock<=p.minStock).sort((a,b)=>a.stock-b.stock);
  return `<div class="cards"><div class="card ${owed?'warn':''}"><div class="l">Customers owe</div><div class="v">${fmt(owed)}</div></div>
    <div class="card ${low.length?'warn':''}"><div class="l">Low / out of stock</div><div class="v">${low.length}</div></div></div>
  <div class="panel"><h2>Customer balances</h2>${data.customers.sort((a,b)=>b.balance-a.balance).map(c=>`<div class="row"><div>${esc(c.name)}<div class="m">${esc(c.phone||'')} · limit ${fmt(c.creditLimit)}</div></div><b>${fmt(c.balance)}</b></div>`).join('')||'<div class="empty">Nobody owes anything.</div>'}</div>
  <div class="panel"><h2>Unpaid invoices</h2>${data.invoices.sort((a,b)=>String(a.dueDate||'9').localeCompare(String(b.dueDate||'9'))).map(i=>{
    const over = i.dueDate && i.dueDate<today;
    return `<div class="row"><div>${esc(i._id)} · ${esc(i.customerName)}${over?'<span class="tag bad">Overdue</span>':''}<div class="m">${new Date(i.date).toLocaleDateString()} · due ${esc(i.dueDate||'-')} · paid ${fmt(i.paid)} of ${fmt(i.total)}</div></div><b>${fmt(i.balance)}</b></div>`; }).join('')||'<div class="empty">No unpaid invoices.</div>'}</div>
  <div class="panel"><h2>Needs restocking</h2>${low.map(p=>`<div class="row"><div>${esc(p.name)}<div class="m">${esc(p.category)} · minimum ${p.minStock}</div></div><b>${p.stock<=0?'<span class="tag bad">Out</span>':p.stock+' '+esc(p.unit)}</b></div>`).join('')||'<div class="empty">Everything is above minimum.</div>'}</div>`;
}

document.getElementById('tabs').addEventListener('click', e=>{ const b=e.target.closest('button'); if(b){ tab=b.dataset.t; draw(); } });
function start(){
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  document.documentElement.style.setProperty('--hh', $('hd').offsetHeight+'px');
  load(); clearInterval(timer); timer = setInterval(()=>{ if(!document.hidden) load(); }, 30000);
}
if(auth) start(); else $('login').classList.remove('hidden');
</script>
</body>
</html>
